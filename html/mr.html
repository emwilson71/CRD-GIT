<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>cDesktop for Remote Diagnostics</title>  
    <style>  
        body {  
            background-color: #202020;  
            color: white;  
            font-family: Arial, sans-serif;  
            margin: 0;  
            padding: 0;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            min-height: 100vh;  
        }  

        .content {  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            width: 100%;  
            height: 100vh;  
            padding: 0;  
        }  

        .image-container {  
            width: 100%;  
            height: 100%;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
        }  

        .image-container img {  
            width: 100%;  
            height: 100%;  
            object-fit: contain; /* Maintains aspect ratio */  
            object-position: center; /* Centers the image */  
        }  

        /* Alternative stretch method */  
        .image-container img.stretch {  
            width: 100%;  
            height: 100%;  
            object-fit: cover; /* Covers entire area, may crop */  
        }  

        /* Responsive design */  
        @media (max-width: 768px) {  
            .content {  
                flex-direction: column;  
            }  
        }  
    </style>  
</head>  
<body>  
    <div class="content">  
        <div class="image-container">  
            <img src="image/mr.png" alt="MR Logo">  
            
            <!-- Uncomment for alternative stretch method -->  
            <!-- <img src="image/fortian.jpg" alt="Fortian Logo" class="stretch"> -->  
        </div>  
    </div>  
</body>  
</html>
